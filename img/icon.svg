<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="#4ecdc4"/>

  <!-- Splat mark -->
  <circle cx="256" cy="280" r="140" fill="#8cc63f" opacity="0.5"/>

  <!-- Fly body -->
  <ellipse cx="256" cy="270" rx="70" ry="80" fill="#555"/>
  <ellipse cx="256" cy="270" rx="65" ry="75" fill="#6b6b6b"/>

  <!-- Head -->
  <circle cx="256" cy="185" r="40" fill="#555"/>
  <circle cx="256" cy="185" r="36" fill="#6b6b6b"/>

  <!-- Eyes -->
  <ellipse cx="240" cy="180" rx="16" ry="18" fill="white"/>
  <circle cx="244" cy="180" r="9" fill="#2d3436"/>
  <circle cx="247" cy="177" r="3.5" fill="white"/>
  <ellipse cx="272" cy="180" rx="16" ry="18" fill="white"/>
  <circle cx="268" cy="180" r="9" fill="#2d3436"/>
  <circle cx="271" cy="177" r="3.5" fill="white"/>

  <!-- Wings -->
  <ellipse cx="185" cy="220" rx="50" ry="28" fill="#d4e8f0" fill-opacity="0.7" transform="rotate(-10 185 220)"/>
  <ellipse cx="327" cy="220" rx="50" ry="28" fill="#d4e8f0" fill-opacity="0.7" transform="rotate(10 327 220)"/>

  <!-- Text -->
  <text x="256" y="430" font-family="Arial, sans-serif" font-size="80" font-weight="800" fill="white" text-anchor="middle">SPLAT!</text>
</svg>
