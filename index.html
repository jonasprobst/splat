<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#4ecdc4">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Splat!</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="img/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="img/icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/game.css">
  <link rel="stylesheet" href="css/settings.css">
  <link rel="stylesheet" href="css/victory.css">
</head>
<body>

  <!-- Title Screen -->
  <section id="screen-title" class="screen screen--active">
    <div class="title">
      <h1 class="title__logo">Splat!</h1>
      <div class="title__fly-decoration" aria-hidden="true">
        <img src="img/fly.svg" alt="" class="title__fly-img">
      </div>
      <div class="title__buttons">
        <button id="btn-play" class="btn btn--primary btn--large" aria-label="Spielen">
          <span class="btn__icon" aria-hidden="true">&#9654;</span>
        </button>
        <button id="btn-settings" class="btn btn--secondary" aria-label="Einstellungen">
          <svg class="btn__icon-svg" viewBox="0 0 24 24" width="32" height="32" aria-hidden="true">
            <path fill="currentColor" d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96a7.04 7.04 0 0 0-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84a.48.48 0 0 0-.48.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.49.49 0 0 0-.59.22L2.74 8.87a.48.48 0 0 0 .12.61l2.03 1.58c-.05.3-.07.62-.07.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.26.41.48.41h3.84c.24 0 .44-.17.48-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/>
          </svg>
        </button>
      </div>
    </div>
  </section>

  <!-- Game Screen -->
  <section id="screen-game" class="screen">
    <div class="game">
      <div class="game__header">
        <span id="round-counter" class="game__round">1 / 10</span>
      </div>
      <div id="game-area" class="game__area">
        <!-- Flies are dynamically inserted here -->
      </div>
      <div class="game__footer">
        <button id="btn-replay" class="btn btn--round" aria-label="Nochmal anhören">
          <svg class="btn__icon-svg" viewBox="0 0 24 24" width="36" height="36" aria-hidden="true">
            <path fill="currentColor" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05A4.47 4.47 0 0 0 16.5 12zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
          </svg>
        </button>
      </div>
    </div>
  </section>

  <!-- Victory Screen -->
  <section id="screen-victory" class="screen">
    <div class="victory">
      <div id="confetti-container" class="victory__confetti" aria-hidden="true"></div>
      <div class="victory__content">
        <div class="victory__star" aria-hidden="true">&#11088;</div>
        <h2 class="victory__message">Super!</h2>
        <div class="victory__buttons">
          <button id="btn-play-again" class="btn btn--primary btn--large" aria-label="Nochmal spielen">
            <span class="btn__icon" aria-hidden="true">&#9654;</span>
          </button>
          <button id="btn-home" class="btn btn--secondary" aria-label="Zurück">
            <svg class="btn__icon-svg" viewBox="0 0 24 24" width="32" height="32" aria-hidden="true">
              <path fill="currentColor" d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </section>

  <!-- Settings Screen -->
  <section id="screen-settings" class="screen">
    <div class="settings">
      <div class="settings__header">
        <button id="btn-back" class="btn btn--icon" aria-label="Zurück">
          <svg class="btn__icon-svg" viewBox="0 0 24 24" width="28" height="28" aria-hidden="true">
            <path fill="currentColor" d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
          </svg>
        </button>
        <h2 class="settings__title">Einstellungen</h2>
      </div>
      <div id="settings-content" class="settings__content">
        <!-- Settings UI is dynamically rendered here -->
      </div>
    </div>
  </section>

  <script type="module" src="js/app.js"></script>
</body>
</html>
